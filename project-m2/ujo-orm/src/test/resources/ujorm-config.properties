# For a test of the ConfigImpl class only
org.ujorm.testOnly=fileValue

# The first key in the sequence represents the primary key.
_org.ujorm.firstPropertyIsIdentifier = true;

# Maximum size of the cache in the ResultSet Mapper
_org.ujorm.maxCacheSize = 512;

# Batch size for the INSERT
_org.ujorm.insertBatchSize = 512;

# Prints all SQL templates to the log.
_org.ujorm.printSql = true;

# Enable quoting the SQL columns
_org.ujorm.enableSqlQuoting = true;

# Write a warning if the column is not a relation and has no JDBC mapping.
_org.ujorm.columnMappingWarning = true;

# Print warnings, if Connection autocommit is true in batch operations.
_org.ujorm.autoCommitWarned = true;

# JUL logging - applied automatically by Config on class load.
# UjormConsoleHandler writes to System.out so that  ./mvnw test | tee log.txt  captures SQL.
handlers = org.ujorm.tools.logging.UjormConsoleHandler
java.util.logging.SimpleFormatter.format = %1$tFT%1$tT.%1$tL %4$s: %5$s%6$s%n
org.ujorm.tools.jdbc.AbstractSqlQuery.level = WARNING